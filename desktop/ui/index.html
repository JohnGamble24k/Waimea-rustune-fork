<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Waimea</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="modern">
<div class="app">
    <header class="bar" data-tauri-drag-region>
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M0 50C8 48 14 42 19 33C25 21 34 12 45 12C54 12 60 19 59 27C58 34 50 37 45 33C41 30 42 24 47 24C43 21 37 24 34 31C30 41 36 50 64 48V56H0Z"/></svg>
      <span class="word" data-tauri-drag-region>Waimea</span>
      <span class="grow" data-tauri-drag-region></span>
      <button id="library-toggle" class="plain" type="button" aria-controls="library" aria-expanded="false" aria-label="Bibliotheek tonen"><svg viewBox="0 0 24 24"><path id="toggle-icon" d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button id="minimize" class="plain" type="button" aria-label="Minimaliseren"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
      <button id="close" class="plain" type="button" aria-label="Sluiten"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </header>
  <div class="flipper"><div class="card">
    <main class="stage">
      <div class="modern">
    <section class="now" aria-live="polite">
      <figure id="art" hidden>
        <img id="art-image" alt="">
        <figcaption id="art-credit"></figcaption>
      </figure>
      <div class="words">
        <h1 id="title">Kies muziek of een radiostation</h1>
        <p id="artist"></p>
        <p id="error" role="status"></p>
      </div>
    </section>
    <div class="sea"><canvas id="wave" aria-hidden="true"></canvas></div>
    <section id="eq" class="eq" aria-label="Equalizer" hidden>
      <div class="eq-head">
        <label class="switch"><input id="eq-on" type="checkbox"> Equalizer aan</label>
        <select id="eq-preset" aria-label="Voorinstelling"></select>
      </div>
      <div id="eq-bands" class="eq-bands"></div>
    </section>
      </div>
  <div class="classic">
    <canvas id="winamp" width="275" height="116" aria-label="Klassieke speler"></canvas>
    <p id="loading">Skin laden</p>
  </div>
    </main>
    <section id="library" class="library" aria-label="Bibliotheek">
  <nav role="tablist" data-tauri-drag-region>
    <button role="tab" data-source="local" aria-selected="true">Muziek</button>
    <button role="tab" data-source="radio" aria-selected="false">Radio</button>
    <button role="tab" data-source="queue" aria-selected="false">Afspeellijst</button>
    <button role="tab" data-source="skins" aria-selected="false">Uiterlijk</button>
  </nav>
  <form id="search" role="search">
    <input id="query" type="search" autocomplete="off" spellcheck="false" aria-label="Zoeken">
  </form>
  <div id="chips" hidden></div>
  <div id="add">
    <button id="add-files" type="button">Bestanden toevoegen</button>
    <button id="add-folder" type="button">Map toevoegen</button>
  </div>
  <ul id="results" aria-live="polite"></ul>
  <p id="message" role="status"></p>
</section>
  </div></div>
    <section class="controls" aria-label="Bediening">
      <div class="seek">
        <span id="elapsed">0:00</span>
        <input id="position" type="range" min="0" max="1000" value="0" aria-label="Positie" disabled>
        <span id="duration"></span>
      </div>
      <div class="buttons">
        <div class="side">
          <button id="shuffle" class="plain toggle" type="button" aria-label="Willekeurig" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
          <button id="repeat" class="plain toggle" type="button" aria-label="Herhalen" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 8h11a3 3 0 0 1 3 3v2M18 16H7a3 3 0 0 1-3-3v-2M15 5l3 3-3 3M9 19l-3-3 3-3"/></svg><b id="repeat-one" hidden>1</b></button>
        </div>
        <div class="main-buttons">
          <button id="prev" class="plain" type="button" aria-label="Vorige"><svg viewBox="0 0 24 24"><path class="solid" d="M18 5v14L8 12zM5 5h2.4v14H5z"/></svg></button>
          <button id="play" type="button" aria-label="Afspelen"><svg viewBox="0 0 24 24"><path id="play-icon" class="solid" d="M8 5v14l11-7z"/></svg></button>
          <button id="next" class="plain" type="button" aria-label="Volgende"><svg viewBox="0 0 24 24"><path class="solid" d="M6 5v14l10-7zM16.6 5H19v14h-2.4z"/></svg></button>
        </div>
        <div class="side end">
          <svg class="speaker" viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
          <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
          <button id="eq-toggle" class="plain toggle label" type="button" aria-expanded="false">EQ</button>
        </div>
      </div>
    </section>
</div>
<script src="app.js"></script>
</body>
</html>

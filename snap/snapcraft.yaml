name: waimea
title: Waimea
base: core24
adopt-info: waimea
summary: Music and internet radio in a skinnable, retro-modern player
description: |
  Waimea is a lightweight music player named after the waves of Hawaii. It opens
  with a few chords of steel guitar and shows your music in a compact, skinnable
  player with a visualizer and a 10-band equalizer.

  - Plays your music library: MP3, FLAC, OGG, WAV, M4A and more
  - Finds and plays internet radio stations from around the world
  - Comes with its own deep-sea skin and loads classic .wsz skins
  - Can be controlled from scripts and AI agents with `waimea.cli`

  Waimea is open source and based on rustune by dzulfikar08.
license: MIT
website: https://github.com/JohnGamble24k/Waimea
source-code: https://github.com/JohnGamble24k/Waimea
issues: https://github.com/JohnGamble24k/Waimea/issues
contact: https://github.com/JohnGamble24k/Waimea/issues
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

# alsa-lib loads its PulseAudio plugin from these fixed paths.
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1

apps:
  # The desktop app; `snap run waimea` or the Waimea icon.
  waimea:
    command: bin/waimea-desktop
    command-chain: [bin/pulse-launch]
    extensions: [gnome]
    environment:
      ALSA_CONFIG_PATH: $SNAP/etc/asound.conf
    plugs: [audio-playback, network, home, removable-media, single-instance-plug]
    slots: [mpris, single-instance]
  # Remote control and terminal player, for scripts and agents.
  cli:
    command: bin/waimea
    command-chain: [bin/pulse-launch]
    environment:
      ALSA_CONFIG_PATH: $SNAP/etc/asound.conf
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib
    plugs: [audio-playback, network, home, removable-media]

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: org.io_github_johngamble24k_waimea.SingleInstance

slots:
  mpris:
    interface: mpris
    name: waimea
  single-instance:
    interface: dbus
    bus: session
    name: org.io_github_johngamble24k_waimea.SingleInstance

parts:
  waimea:
    plugin: rust
    source: .
    build-snaps: [rustup]
    build-packages: [libasound2-dev, pkg-config]
    stage-packages: [libasound2t64, libasound2-data, libasound2-plugins]
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
    # libasound2-plugins drags in ffmpeg, jack and more for plugins waimea
    # never loads; keep alsa-lib, its PulseAudio plugin and libpulse's deps.
    prime:
      - bin/waimea
      - usr/share/alsa
      - usr/lib/*/libasound.so.2*
      - usr/lib/*/alsa-lib/libasound_module_pcm_pulse.so
      - usr/lib/*/alsa-lib/libasound_module_ctl_pulse.so
      - usr/lib/*/libpulse.so.0*
      - usr/lib/*/pulseaudio
      - usr/lib/*/libsndfile.so.1*
      - usr/lib/*/libFLAC.so.*
      - usr/lib/*/libvorbis.so.*
      - usr/lib/*/libvorbisenc.so.*
      - usr/lib/*/libogg.so.*
      - usr/lib/*/libopus.so.*
      - usr/lib/*/libmpg123.so.*
      - usr/lib/*/libmp3lame.so.*
      - usr/lib/*/libasyncns.so.*
      - usr/lib/*/libX11.so.*
      - usr/lib/*/libX11-xcb.so.*
      - usr/lib/*/libxcb.so.*
      - usr/lib/*/libXau.so.*
      - usr/lib/*/libXdmcp.so.*
      - usr/lib/*/libbsd.so.*
      - usr/lib/*/libmd.so.*

  desktop:
    plugin: rust
    source: .
    rust-path: [desktop]
    build-snaps: [rustup]
    build-packages: [libasound2-dev, pkg-config, libwebkit2gtk-4.1-dev, librsvg2-dev, libssl-dev, build-essential, file]
    stage-packages: [libwebkit2gtk-4.1-0]

  # ALSA config that routes the default device to PulseAudio, and the
  # launcher that points libpulse at the host's socket.
  audio:
    plugin: dump
    source: snap/local
    organize:
      asound.conf: etc/asound.conf
      pulse-launch: bin/pulse-launch
